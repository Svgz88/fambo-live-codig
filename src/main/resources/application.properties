spring.application.name=demo

spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=jdbc:postgresql://${DOCKER_DB_HOST:localhost}:5432/${POSTGRES_DB:fambo-db}
spring.datasource.username=${POSTGRES_USER:fambo-user}
spring.datasource.password=${POSTGRES_PASSWORD:fambo-password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

